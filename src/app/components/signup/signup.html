<div class="min-h-screen bg-gray-100 flex items-center justify-center p-6">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

    <h1 class="text-3xl font-bold text-center text-gray-800">
      Create Account
    </h1>

    <p class="text-center text-gray-500 mt-2 mb-8">
      Create your account
    </p>


    <!-- Error -->

    @if (errorMessage) {

      <div class="mb-5 p-3 bg-red-100 text-red-700 rounded-lg">
        {{ errorMessage }}
      </div>

    }


    <!-- Success -->

    @if (successMessage) {

      <div class="mb-5 p-3 bg-green-100 text-green-700 rounded-lg">
        {{ successMessage }}
      </div>

    }


    <form (ngSubmit)="signup()">

      <!-- Username -->

      <div class="mb-4">

        <label
          for="username"
          class="block text-sm font-semibold text-gray-700 mb-2"
        >
          Username
        </label>

        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Enter username"

          class="w-full px-4 py-3 border border-gray-300 rounded-lg
                 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

      </div>


      <!-- Email -->

      <div class="mb-4">

        <label
          for="email"
          class="block text-sm font-semibold text-gray-700 mb-2"
        >
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter email"

          class="w-full px-4 py-3 border border-gray-300 rounded-lg
                 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

      </div>


      <!-- Password -->

      <div class="mb-4">

        <label
          for="password"
          class="block text-sm font-semibold text-gray-700 mb-2"
        >
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter password"

          class="w-full px-4 py-3 border border-gray-300 rounded-lg
                 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

      </div>


      <!-- Confirm Password -->

      <div class="mb-6">

        <label
          for="confirmPassword"
          class="block text-sm font-semibold text-gray-700 mb-2"
        >
          Confirm Password
        </label>

        <input
          id="confirmPassword"
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Confirm password"

          class="w-full px-4 py-3 border border-gray-300 rounded-lg
                 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

      </div>


      <!-- Signup -->

      <button
        type="submit"

        class="w-full bg-blue-600 hover:bg-blue-700
               text-white font-semibold py-3 rounded-lg
               transition"
      >
        Create Account
      </button>

    </form>


    <!-- Login -->

    <p class="text-center text-gray-600 mt-6">

      Already have an account?

      <a
        routerLink="/"
        class="text-blue-600 font-semibold hover:underline cursor-pointer ml-1"
      >
        Login
      </a>

    </p>

  </div>

</div>
