<div
  class="min-h-screen flex items-center justify-center
         bg-gradient-to-br from-blue-600 to-indigo-700 p-6"
>

  <div
    class="bg-white w-full max-w-md rounded-2xl
           shadow-2xl p-8"
  >

    <h1
      class="text-3xl font-bold text-center text-gray-800"
    >
      Welcome Back
    </h1>


    <p
      class="text-center text-gray-500 mt-2 mb-8"
    >
      Login to your account
    </p>


    @if (errorMessage) {

      <div
        class="bg-red-100 text-red-700
               p-3 rounded-lg mb-4"
      >
        {{ errorMessage }}
      </div>

    }


    <form (ngSubmit)="login()">

      <label
        class="block text-sm font-medium mb-2"
      >
        Email or Username
      </label>


      <input
        type="text"
        name="identifier"
        [(ngModel)]="identifier"
        placeholder="Enter email or username"

        class="w-full border rounded-lg
               px-4 py-3 mb-5
               focus:ring-2 focus:ring-blue-500
               outline-none"
      />


      <label
        class="block text-sm font-medium mb-2"
      >
        Password
      </label>


      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Enter password"

        class="w-full border rounded-lg
               px-4 py-3 mb-6
               focus:ring-2 focus:ring-blue-500
               outline-none"
      />


      <button
        type="submit"

        class="w-full bg-blue-600
               hover:bg-blue-700
               text-white font-semibold
               py-3 rounded-lg"
      >
        Login
      </button>

    </form>


    <div
      class="flex items-center my-6"
    >

      <div class="flex-1 border-t"></div>

      <span class="px-3 text-gray-400">
        OR
      </span>

      <div class="flex-1 border-t"></div>

    </div>


    <button
      type="button"

      (click)="connectMicrosoft()"

      class="w-full border border-gray-300
             py-3 rounded-lg font-semibold
             hover:bg-gray-50"
    >
      🔵 Connect Microsoft / Hotmail
    </button>


    <p
      class="text-center mt-6 text-gray-600"
    >

      Don't have an account?

      <a
        routerLink="/signup"

        class="text-blue-600
               font-semibold
               hover:underline"
      >
        Sign Up
      </a>

    </p>

  </div>

</div>
