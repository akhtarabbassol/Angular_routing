<div
  class="min-h-screen
         flex
         items-center
         justify-center
         bg-gray-100
         px-4"
>

  <div
    class="bg-white
           w-full
           max-w-md
           rounded-2xl
           shadow-xl
           p-8
           text-center"
  >

    <div
      class="w-20
             h-20
             mx-auto
             bg-green-100
             rounded-full
             flex
             items-center
             justify-center
             text-4xl"
    >

      ✓

    </div>


    <h1
      class="text-2xl
             font-bold
             text-gray-800
             mt-5"
    >

      Login Successful

    </h1>


    <p
      class="text-gray-500
             mt-2
             mb-8"
    >

      Now connect your
      Hotmail / Outlook account.

    </p>


    <button

      (click)="connectMicrosoft()"

      class="w-full
             bg-blue-600
             hover:bg-blue-700
             text-white
             py-4
             rounded-xl
             font-semibold
             transition"
    >

      Connect with Microsoft

    </button>


    <p
      class="text-xs
             text-gray-400
             mt-5"
    >

      Your Microsoft password
      is never stored.

    </p>

  </div>

</div>
